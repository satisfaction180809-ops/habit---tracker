
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101114">
<title>Habit Tracker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  background: #101114;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
}

h1 {
  font-size: 32px;
}

p {
  color: #a5a5ad;
}

form {
  display: flex;
  gap: 8px;
  margin: 24px 0;
}

input, button {
  padding: 13px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}

form input {
  min-width: 0;
  flex: 1;
  background: #24262d;
  color: white;
}

button {
  background: #8b7cff;
  color: white;
  cursor: pointer;
  touch-action: manipulation;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px;
  margin: 10px 0;
  background: #202127;
  border-radius: 12px;
}

li span {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

li.done span {
  text-decoration: line-through;
  color: #888;
}

/* Отдельные настройки отметок для телефонов */
li input[type="checkbox"] {
  -webkit-appearance: auto;
  appearance: auto;
  accent-color: #8b7cff;
  flex: 0 0 26px;
  width: 26px;
  height: 26px;
  min-width: 26px;
  margin: 0;
  padding: 0;
  border: initial;
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
}

li button {
  background: #383941;
  padding: 10px;
  flex-shrink: 0;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid #b8afff;
  outline-offset: 3px;
}

@media (max-width: 420px) {
  body {
    padding: 16px;
  }

  h1 {
    font-size: 28px;
  }

  form {
    gap: 6px;
  }

  form input,
  form button {
    padding: 12px 10px;
    font-size: 14px;
  }

  li {
    gap: 10px;
    padding: 12px;
  }

  li button {
    font-size: 14px;
  }
}
</style>
</head>

<body>
<main>
  <h1>Мои привычки</h1>
  <p>Маленькие действия. Регулярный прогресс.</p>

  <form id="form">
    <input
      id="habit"
      type="text"
      placeholder="Новая привычка..."
      autocomplete="off"
      required
    >
    <button type="submit">Добавить</button>
  </form>

  <p>Выполнено сегодня: <strong id="progress">0 / 0</strong></p>
  <ul id="list"></ul>
</main>

<script>
const form = document.getElementById('form');
const input = document.getElementById('habit');
const list = document.getElementById('list');
const progress = document.getElementById('progress');

let habits = [];

try {
  const saved = JSON.parse(localStorage.getItem('habits') || '[]');

  if (Array.isArray(saved)) {
    habits = saved
      .filter(h => h && typeof h.name === 'string')
      .map(h => ({
        name: h.name,
        done: h.done === true
      }));
  }
} catch (error) {
  console.error('Не удалось загрузить привычки:', error);
}

function save() {
  try {
    localStorage.setItem('habits', JSON.stringify(habits));
    render();
  } catch (error) {
    console.error('Не удалось сохранить привычки:', error);
    alert('Не удалось сохранить изменения. Проверь настройки браузера.');
  }
}

function render() {
  list.innerHTML = '';

  habits.forEach((habit, index) => {
    const li = document.createElement('li');

    if (habit.done) {
      li.classList.add('done');
    }

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = habit.done;
    check.setAttribute('aria-label', 'Отметить: ' + habit.name);

    check.addEventListener('change', () => {
      habits[index].done = check.checked;
      save();
    });

    const name = document.createElement('span');
    name.textContent = habit.name;

    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = 'Удалить';
    del.setAttribute('aria-label', 'Удалить: ' + habit.name);

    del.addEventListener('click', () => {
      habits.splice(index, 1);
      save();
    });

    li.append(check, name, del);
    list.append(li);
  });

  const completed = habits.filter(h => h.done).length;
  progress.textContent = completed + ' / ' + habits.length;
}

form.addEventListener('submit', event => {
  event.preventDefault();

  const name = input.value.trim();
  if (!name) return;

  habits.push({
    name: name,
    done: false
  });

  input.value = '';
  save();
  input.focus();
});

render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error => {
        console.error('Ошибка офлайн-режима:', error);
      });
  });
}
</script>
</body>
</html>
