<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101114">
<title>Habit Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#101114;color:#f5f5f5;font-family:Arial,sans-serif}
main{max-width:600px;margin:auto}
h1{font-size:32px}
p{color:#a5a5ad}
form{display:flex;gap:8px;margin:24px 0}
input,button{padding:13px;border:0;border-radius:10px;font-size:16px}
input{min-width:0;flex:1;background:#24262d;color:white}
button{background:#8b7cff;color:white;cursor:pointer}
ul{list-style:none;padding:0}
li{display:flex;align-items:center;gap:10px;padding:15px;margin:10px 0;background:#202127;border-radius:12px}
li span{flex:1;overflow-wrap:anywhere}
li.done span{text-decoration:line-through;color:#888}
li input{flex:0;width:20px;height:20px}
li button{background:#383941;padding:9px}
</style>
</head>
<body>
<main>
<h1>Мои привычки</h1>
<p>Маленькие действия. Регулярный прогресс.</p>
<form id="form">
<input id="habit" placeholder="Новая привычка..." required>
<button type="submit">Добавить</button>
</form>
<p>Выполнено сегодня: <strong id="progress">0 / 0</strong></p>
<ul id="list"></ul>
</main>
<script>
const form=document.getElementById('form');
const input=document.getElementById('habit');
const list=document.getElementById('list');
const progress=document.getElementById('progress');
let habits=[];
try{habits=JSON.parse(localStorage.getItem('habits')||'[]')}catch(e){}
function save(){
localStorage.setItem('habits',JSON.stringify(habits));
render();
}
function render(){
list.innerHTML='';
habits.forEach((h,i)=>{
const li=document.createElement('li');
if(h.done)li.className='done';
const check=document.createElement('input');
check.type='checkbox';
check.checked=h.done;
check.setAttribute('aria-label','Отметить выполнение');
check.onchange=()=>{habits[i].done=check.checked;save()};
const name=document.createElement('span');
name.textContent=h.name;
const del=document.createElement('button');
del.textContent='Удалить';
del.onclick=()=>{habits.splice(i,1);save()};
li.append(check,name,del);
list.append(li);
});
progress.textContent=habits.filter(h=>h.done).length+' / '+habits.length;
}
form.onsubmit=e=>{
e.preventDefault();
const name=input.value.trim();
if(!name)return;
habits.push({name,done:false});
input.value='';
save();
};
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error => console.error('Ошибка офлайн-режима:', error));
  });
}
</script>
</body>
</html>
